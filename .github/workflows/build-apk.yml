name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: buku-kas-harian-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang dependensi
        run: npm install

      - name: Buat proyek Android
        run: npx cap add android

      - name: Buat ikon aplikasi
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#13201E' --iconBackgroundColorDark '#13201E'

      - name: Sinkronkan web ke Android
        run: npx cap sync android

      - name: Bangun APK
        working-directory: buku-kas-harian-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: buku-kas-harian-apk
          path: buku-kas-harian-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
